<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light only">
<title>网络引擎宏观架构图</title>
<style>
  html, body { background:#ffffff !important; margin:0; padding:16px; color-scheme: light only; }
  svg { width:100%; height:auto; display:block; }
  text { fill:#000000 !important; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
</style>
</head>
<body>
<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">

  <!-- Row1: 应用层 -->
  <rect x="20" y="20" width="960" height="70" rx="10" fill="#c3d1a8" stroke="#8fa06e" stroke-width="2"/>
  <text x="500" y="62" font-size="20" text-anchor="middle" font-weight="bold">上层应用程序（RelayApp / HostAgentApp / 未来 PlayerAgent、CLI 工具…）</text>

  <!-- Row2: API层，两块 -->
  <rect x="20" y="110" width="620" height="70" rx="10" fill="#94b877" stroke="#6f8c52" stroke-width="2"/>
  <text x="330" y="152" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold">HTTP / JSON API（给 webview 前端调用）</text>

  <rect x="660" y="110" width="320" height="70" rx="10" fill="#b9d3ea" stroke="#7fa8c9" stroke-width="2"/>
  <text x="820" y="152" font-size="18" text-anchor="middle" font-weight="bold">C++ 原生 API（App内直接链接）</text>

  <!-- 调用方向箭头：Row1 -> Row2 -->
  <defs>
    <marker id="callArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/>
    </marker>
  </defs>
  <line x1="330" y1="110" x2="330" y2="92" stroke="#c0392b" stroke-width="2" marker-end="url(#callArrow)"/>
  <line x1="820" y1="110" x2="820" y2="92" stroke="#c0392b" stroke-width="2" marker-end="url(#callArrow)"/>
  <text x="1000" y="105" font-size="12" fill="#c0392b" text-anchor="end">红色箭头 = 合法调用方向</text>

  <!-- Row3: 桥接层 + 核心引擎宽条 -->
  <rect x="20" y="200" width="300" height="200" rx="10" fill="#4d7ea8" stroke="#345a78" stroke-width="2"/>
  <text x="170" y="290" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold">HTTP 服务 + JSON 桥接层</text>
  <text x="170" y="316" font-size="13" text-anchor="middle" fill="#e6f0f7">(cpp-httplib)</text>

  <rect x="340" y="200" width="130" height="90" rx="8" fill="#bcdedb" stroke="#5aa79f" stroke-width="2"/>
  <text x="405" y="238" font-size="13" text-anchor="middle">JSON 序列化</text>
  <text x="405" y="258" font-size="13" text-anchor="middle">(nlohmann::json)</text>

  <rect x="340" y="310" width="130" height="90" rx="8" fill="#bcdedb" stroke="#5aa79f" stroke-width="2"/>
  <text x="405" y="348" font-size="13" text-anchor="middle">路由/请求</text>
  <text x="405" y="368" font-size="13" text-anchor="middle">分发绑定</text>

  <!-- Director 门面条：唯一合法入口 -->
  <rect x="490" y="200" width="490" height="46" rx="8" fill="#e8b23d" stroke="#b8862a" stroke-width="2"/>
  <text x="735" y="228" font-size="17" text-anchor="middle" font-weight="bold">Director  ← 引擎唯一门面 / 对外API入口</text>

  <line x1="330" y1="180" x2="700" y2="200" stroke="#c0392b" stroke-width="2" marker-end="url(#callArrow)"/>
  <line x1="820" y1="180" x2="750" y2="200" stroke="#c0392b" stroke-width="2" marker-end="url(#callArrow)"/>

  <!-- 内部私有模块：虚线框，标注"仅Director可调" -->
  <rect x="490" y="256" width="490" height="144" rx="10" fill="#5a8ec0" stroke="#345a78" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="735" y="276" font-size="12" text-anchor="middle" fill="#ffe9c2">▼ 内部私有，外部一律不可直接调用，只能通过Director ▼</text>
  <text x="735" y="300" font-size="14" text-anchor="middle" fill="#ffffff">Session / Scheduler / TunnelManager</text>
  <text x="735" y="324" font-size="14" text-anchor="middle" fill="#ffffff">TransportCore（IOCP） / TlsPskContext</text>
  <text x="735" y="348" font-size="14" text-anchor="middle" fill="#ffffff">FrameCodec / FrameDispatcher / PortPool</text>
  <text x="735" y="384" font-size="12" text-anchor="middle" fill="#cfe3f2">（业务无关，不知道"房间/连接码"这些概念）</text>

  <line x1="735" y1="246" x2="735" y2="254" stroke="#333333" stroke-width="1.5" marker-end="url(#callArrow)"/>
  <text x="800" y="250" font-size="11" fill="#555555">Director内部调度↓</text>

  <!-- Row4: 平台适配 -->
  <rect x="20" y="440" width="960" height="90" rx="10" fill="#dfeee9" stroke="#a9cfc4" stroke-width="2"/>
  <rect x="50" y="465" width="270" height="40" rx="6" fill="#2f5f6b" />
  <text x="185" y="490" font-size="15" text-anchor="middle" fill="#ffffff">Windows（IOCP）</text>

  <rect x="360" y="465" width="270" height="40" rx="6" fill="#2f5f6b" opacity="0.5"/>
  <text x="495" y="490" font-size="15" text-anchor="middle" fill="#ffffff">Linux（epoll，预留）</text>

  <rect x="670" y="465" width="270" height="40" rx="6" fill="#2f5f6b" opacity="0.5"/>
  <text x="805" y="490" font-size="15" text-anchor="middle" fill="#ffffff">macOS（kqueue，预留）</text>

  <text x="500" y="550" font-size="15" text-anchor="middle" fill="#666666">系统平台层</text>

</svg>
</body>
</html>
